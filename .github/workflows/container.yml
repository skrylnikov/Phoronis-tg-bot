name: validate-and-publish

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: build
          POSTGRES_PASSWORD: build
          POSTGRES_USER: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build -d build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.4.0}
      - run: bun install --frozen-lockfile
      - run: bun run db:deploy
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:integration

  image:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute immutable image tag
        id: image
        shell: bash
        run: echo "tag=master-$(date +%s)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/skrylnikov/phoronis-tg-bot:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/skrylnikov/phoronis-tg-bot:${{ steps.image.outputs.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
